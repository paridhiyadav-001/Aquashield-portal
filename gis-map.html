<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time GIS Safe Route - AquaShield</title>
    
    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet GIS Engine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .gis-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1rem;
            height: calc(100vh - 90px);
            margin-top: 10px;
        }

        .gis-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            overflow-y: auto;
        }

        #realGisMap {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        .route-info-box {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.85rem;
        }

        .search-box-group {
            display: flex;
            gap: 6px;
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .gis-container { grid-template-columns: 1fr; height: auto; }
            #realGisMap { height: 450px; }
        }
    </style>
</head>
<body class="light-theme">

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-route logo-icon" style="color:#0284c7;"></i>
            <div>
                <h1>AquaShield GIS</h1>
                <span>Flood Safe Route & Navigation</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <button class="btn btn-red" style="padding: 4px 10px; font-size: 0.8rem;" onclick="logout()">Logout</button>
            <button class="theme-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <main class="container" style="max-width: 100%; padding: 0 1rem;">
        <div class="gis-container">
            
            <aside class="gis-sidebar">
                <h3 style="margin:0; font-size:1.1rem; color:var(--text-primary);">
                    <i class="fa-solid fa-sliders"></i> Safe Route Navigation
                </h3>

                <!-- 1. GPS Start Location Button -->
                <button class="btn btn-blue" style="width:100%; font-weight:bold;" onclick="locateUserOnMap()">
                    <i class="fa-solid fa-crosshairs"></i> Get My GPS Location
                </button>

                <!-- 2. Destination Search Input -->
                <div>
                    <label style="font-size:0.85rem; font-weight:bold; color:var(--text-primary); display:block; margin-bottom:4px;">
                        <i class="fa-solid fa-magnifying-glass-location"></i> Enter Destination Area:
                    </label>
                    <div class="search-box-group">
                        <input type="text" id="destInput" class="search-input" placeholder="e.g. Vijay Nagar, Palasia..." onkeypress="if(event.key === 'Enter') searchDestination()">
                        <button class="btn btn-green" style="padding: 8px 12px;" onclick="searchDestination()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <!-- 3. Vehicle Selection -->
                <div>
                    <label style="font-size:0.85rem; font-weight:bold; color:var(--text-primary); display:block; margin-bottom:4px;">
                        <i class="fa-solid fa-car"></i> Select Vehicle Type:
                    </label>
                    <select id="vehicleType" class="search-input" style="width:100%;" onchange="recalculateSafety()">
                        <option value="2wheeler">🛵 2-Wheeler (Bike / Scooter)</option>
                        <option value="sedan" selected>🚗 Sedan / Hatchback Car</option>
                        <option value="suv">🛻 SUV / Heavy Clearance</option>
                        <option value="emergency">🚒 Emergency / Rescue Truck</option>
                    </select>
                </div>

                <!-- 4. Route & Distance Summary Box -->
                <div class="route-info-box">
                    <h4 style="margin:0 0 6px 0; color:var(--text-primary);"><i class="fa-solid fa-map-pin"></i> Trip Summary</h4>
                    <div id="destNameTxt" style="font-size:0.82rem; color:var(--text-secondary); margin-bottom:2px;">Destination: Not Set</div>
                    <div id="distanceTxt" style="font-weight:bold; color:#0284c7; margin-bottom:6px;">Distance: -- km</div>
                    <div id="safetyAdvice" style="font-size:0.8rem; color:var(--text-secondary);">Type an area name above to calculate safe route.</div>
                </div>

                <!-- Map Layer Switcher -->
                <div style="margin-top:auto;">
                    <h4 style="margin:0 0 6px 0; font-size:0.85rem; color:var(--text-primary);">Map Base View</h4>
                    <label style="font-size:0.8rem; cursor:pointer;"><input type="radio" name="mapTile" value="street" checked onchange="switchMapStyle('street')"> Standard Map</label>
                    <label style="font-size:0.8rem; cursor:pointer; margin-left:10px;"><input type="radio" name="mapTile" value="satellite" onchange="switchMapStyle('satellite')"> Satellite</label>
                </div>
            </aside>

            <!-- Map Viewport -->
            <section style="position:relative;">
                <div id="realGisMap"></div>
            </section>

        </div>
    </main>

    <!-- JS Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>

    <script>
        let map;
        let streetTile, satelliteTile;
        let startMarker, destMarker, routeLine;
        let startCoords = [22.7196, 75.8577]; // Default Start Point (Indore)
        let destCoords = null;

        document.addEventListener("DOMContentLoaded", function() {
            // Auth Check
            const isLoggedIn = localStorage.getItem('isCitizenLoggedIn') === 'true' || localStorage.getItem('isOfficerLoggedIn') === 'true';
            if (!isLoggedIn) {
                sessionStorage.setItem('redirect_after_login', 'gis-map.html');
                window.location.href = 'login.html';
                return;
            }

            // Initialize Map
            map = L.map('realGisMap').setView(startCoords, 13);

            streetTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            satelliteTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });

            // Start Location Marker
            startMarker = L.marker(startCoords).addTo(map).bindPopup("<b>📍 Start Point</b>").openPopup();

            // Waterlogging Risk Zones
            L.circle([22.7220, 75.8600], { color: '#e11d48', fillColor: '#f43f5e', fillOpacity: 0.4, radius: 400 })
                .addTo(map).bindPopup("<b>⚠️ High Flood Risk Zone</b><br>Expected Depth: 2.5 Feet");

            loadComplaintsOnMap();
        });

        // Search Destination Area via OpenStreetMap Geocoding API
        async function searchDestination() {
            const query = document.getElementById('destInput').value.trim();
            if (!query) {
                alert("Please enter a location or area name!");
                return;
            }

            const adviceBox = document.getElementById('safetyAdvice');
            adviceBox.innerHTML = `⏳ <span style="color:#0284c7;">Locating area & calculating route...</span>`;

            try {
                // Free Geocoding API request
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const placeName = data[0].display_name.split(',')[0]; // Extract Short Name

                    setDestination(lat, lon, placeName);
                } else {
                    alert("Location not found! Try searching with city name (e.g., 'Vijay Nagar Indore')");
                    adviceBox.innerHTML = `<span style="color:#e11d48;">Location search failed. Try again.</span>`;
                }
            } catch (error) {
                alert("Search service error. Please check internet connection.");
                adviceBox.innerHTML = `<span style="color:#e11d48;">Network error occurred.</span>`;
            }
        }

        function setDestination(lat, lng, placeName) {
            destCoords = [lat, lng];

            // Remove previous marker & line if exists
            if (destMarker) map.removeLayer(destMarker);
            if (routeLine) map.removeLayer(routeLine);

            // Add Red Destination Circle Marker
            destMarker = L.circleMarker(destCoords, {
                color: '#e11d48',
                fillColor: '#f43f5e',
                fillOpacity: 0.9,
                radius: 12
            }).addTo(map).bindPopup(`<b>🏁 Destination: ${placeName}</b>`).openPopup();

            // Draw Route Line
            routeLine = L.polyline([startCoords, destCoords], { color: '#0284c7', weight: 5, dashArray: '8, 8' }).addTo(map);

            // Zoom map to show both points together
            map.fitBounds([startCoords, destCoords], { padding: [50, 50] });

            // Calculate Distance in KM
            let p1 = L.latLng(startCoords[0], startCoords[1]);
            let p2 = L.latLng(destCoords[0], destCoords[1]);
            let distanceInKm = (p1.distanceTo(p2) / 1000).toFixed(2);

            document.getElementById('destNameTxt').innerText = `Destination: ${placeName}`;
            document.getElementById('distanceTxt').innerText = `Distance: ${distanceInKm} km`;
            
            recalculateSafety();
        }

        function recalculateSafety() {
            if (!destCoords) return;

            let vehicle = document.getElementById('vehicleType').value;
            let adviceBox = document.getElementById('safetyAdvice');

            if (vehicle === '2wheeler') {
                adviceBox.innerHTML = `<span style="color:#e11d48; font-weight:bold;">⚠️ HIGH RISK:</span> Waterlogged underpasses detected. Avoid 2-wheelers on this route.`;
            } else if (vehicle === 'sedan') {
                adviceBox.innerHTML = `<span style="color:#d97706; font-weight:bold;">⚠️ MODERATE RISK:</span> Proceed with caution. Recommended water clearance is 1 Foot.`;
            } else if (vehicle === 'suv') {
                adviceBox.innerHTML = `<span style="color:#059669; font-weight:bold;">✅ SAFE ROUTE:</span> High clearance SUV suitable for current route depth.`;
            } else if (vehicle === 'emergency') {
                adviceBox.innerHTML = `<span style="color:#059669; font-weight:bold;">🚑 EMERGENCY CLEARANCE:</span> Priority route access granted.`;
            }
        }

        function locateUserOnMap() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition((pos) => {
                startCoords = [pos.coords.latitude, pos.coords.longitude];
                startMarker.setLatLng(startCoords).bindPopup("<b>📍 Live GPS Location</b>").openPopup();
                map.flyTo(startCoords, 14);
                if (destCoords) {
                    routeLine.setLatLngs([startCoords, destCoords]);
                    map.fitBounds([startCoords, destCoords], { padding: [50, 50] });
                }
            });
        }

        function switchMapStyle(type) {
            if (type === 'satellite') {
                map.removeLayer(streetTile);
                map.addLayer(satelliteTile);
            } else {
                map.removeLayer(satelliteTile);
                map.addLayer(streetTile);
            }
        }

        function loadComplaintsOnMap() {
            let complaints = JSON.parse(localStorage.getItem('aqua_complaints') || '[]');
            complaints.forEach((c) => {
                if (c.location && c.location.includes(',')) {
                    let parts = c.location.split(',');
                    let lat = parseFloat(parts[0].trim());
                    let lng = parseFloat(parts[1].trim());
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(map).bindPopup(`<b>${c.id}</b><br>Type: ${c.type}<br>Depth: ${c.depth}`);
                    }
                }
            });
        }
    </script>
</body>
</html>
