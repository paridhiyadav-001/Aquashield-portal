<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Portal Verification - AquaShield</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-shield-halved logo-icon"></i>
            <div>
                <h1>AquaShield</h1>
                <span>Municipal / PWD Portal</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a>
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <main class="container">
        <div class="form-container" style="max-width:420px; margin: 3rem auto; border-color: #fde68a;">
            <div class="form-header" style="text-align:center;">
                <h2 style="color:#d97706;"><i class="fa-solid fa-user-shield"></i> Authority Verification</h2>
                <p>Restricted access for PWD & Municipal Corporation Officers.</p>
            </div>

            <form onsubmit="handleOfficerLogin(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-id-badge"></i> Officer ID</label>
                    <input type="text" id="officerId" placeholder="e.g. PWD-OFFICER-101" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> Security PIN / Verification Code</label>
                    <input type="password" id="officerPin" placeholder="Demo PIN: 1234" required>
                </div>

                <button type="submit" class="btn btn-dark submit-btn">
                    <i class="fa-solid fa-shield-check"></i> Verify Credentials & Open Dashboard
                </button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
